name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate architecture
        shell: bash
        run: |
          set -e
          fail=0
          # Domain layer cannot import from infrastructure or presentation
          if grep -rE "from ['\"](.*infrastructure|.*presentation)" src/domain/ 2>/dev/null; then
            echo "ERR: domain/ imports from infrastructure or presentation (DIP violation)"
            fail=1
          fi
          # Application layer cannot import from infrastructure or presentation
          if grep -rE "from ['\"](.*infrastructure|.*presentation)" src/application/ 2>/dev/null; then
            echo "ERR: application/ imports from infrastructure or presentation (DIP violation)"
            fail=1
          fi
          [ $fail -eq 0 ] && echo "Clean Architecture boundaries valid." || exit 1
