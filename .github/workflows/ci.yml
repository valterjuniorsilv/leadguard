name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Clean Architecture boundaries
        shell: bash
        run: |
          set -e
          fail=0
          if grep -rE "from ['\"](.*infrastructure|.*presentation)" src/domain/ 2>/dev/null; then
            echo "ERR: domain/ imports from infrastructure or presentation (DIP violation)"
            fail=1
          fi
          if grep -rE "from ['\"](.*infrastructure|.*presentation)" src/application/ 2>/dev/null; then
            echo "ERR: application/ imports from infrastructure or presentation (DIP violation)"
            fail=1
          fi
          [ $fail -eq 0 ] && echo "Clean Architecture boundaries valid." || exit 1

      - name: Validate folder structure
        shell: bash
        run: |
          set -e
          for d in src/domain src/application src/presentation src/infrastructure; do
            if [ ! -d "$d" ]; then
              echo "Missing layer: $d"
              exit 1
            fi
          done
          echo "All 4 architectural layers present."

      - name: Validate domain layer has entities + value-objects + interfaces
        shell: bash
        run: |
          for d in entities value-objects interfaces; do
            if [ ! -d "src/domain/$d" ]; then
              echo "Domain layer missing: $d/"
              exit 1
            fi
          done
          echo "Domain layer is complete (DDD)."

      - name: Count files per layer
        shell: bash
        run: |
          for layer in domain application presentation infrastructure; do
            count=$(find src/$layer -name '*.ts' 2>/dev/null | wc -l | tr -d ' ')
            echo "$layer: $count .ts files"
          done
